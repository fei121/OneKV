[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentserve-repro"
version = "0.1.0"
description = "Reproduction of AgentServe: efficient agentic AI serving on a consumer-grade GPU"
requires-python = ">=3.10"
dependencies = ["requests", "pyyaml"]
[project.optional-dependencies]
[project.scripts]
agentserve-trace = "agentserve_repro.trace:main"
agentserve-phase = "agentserve_repro.phase:self_test"
agentserve-orchestrate = "agentserve_repro.scheduler:self_test"
[tool.setuptools.packages.find]
where = ["src"]
