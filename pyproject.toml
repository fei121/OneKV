[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onekv"
version = "0.1.0"
description = "OneKV: single-engine shared-KV serving for agentic AI on a consumer GPU"
requires-python = ">=3.10"
dependencies = ["requests", "pyyaml"]
[project.optional-dependencies]
[project.scripts]
onekv-trace = "onekv.trace:main"
onekv-phase = "onekv.phase:self_test"
onekv-orchestrate = "onekv.scheduler:self_test"
[tool.setuptools.packages.find]
where = ["src"]
